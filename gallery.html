<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — T Devamani Raju</title>
<meta name="description" content="Photography and travel photo gallery by T Devamani Raju — street, portrait, macro, landscape, treks and trips.">
<meta name="theme-color" content="#0a0e14">
<link rel="icon" href="assets/icons/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css?v=20261117">
<link rel="stylesheet" href="css/dev.css?v=20261151">
</head>
<body data-page="gallery" data-root="">

<div id="site-header"></div>

<main id="main">
  <section class="dv-head"><div class="dv-wrap"><span class="dv-path">~/gallery</span><h1>Gallery</h1><p>Frames from the street, the mountains and the road &mdash; the photography collection, and the photos from trips and treks.</p><div class="dv-chips static"><span id="g-total"></span><span>Photography</span><span>Travel</span><span>Memories</span></div></div></section>

  <div class="gallery-wrap">
    <!-- Two collections: my photography vs. photos from trips / memories -->
    <div class="g-tabs" role="tablist" aria-label="Gallery collections">
      <button role="tab" id="tab-photography" aria-selected="true" data-tab="photography"><i class="fa-solid fa-camera"></i> Photography <span class="n" id="n-photography"></span></button>
      <button role="tab" id="tab-trips" aria-selected="false" data-tab="trips"><i class="fa-solid fa-mountain-sun"></i> Travel &amp; Memories <span class="n" id="n-trips"></span></button>
      <button role="tab" id="tab-all" aria-selected="false" data-tab="all"><i class="fa-solid fa-images"></i> All <span class="n" id="n-all"></span></button>
    </div>
    <div class="g-filters" id="g-filters" role="group" aria-label="Filter photos"></div>
    <div class="g-grid" id="g-grid" aria-live="polite"></div>
  </div>
</main>

<div id="site-footer"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-close" aria-label="Close viewer" data-lb="close"><i class="fa-solid fa-xmark"></i></button>
  <button class="lb-nav prev" aria-label="Previous photo" data-lb="prev"><i class="fa-solid fa-chevron-left"></i></button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption><strong id="lb-cap"></strong><span id="lb-meta"></span></figcaption>
  </figure>
  <button class="lb-nav next" aria-label="Next photo" data-lb="next"><i class="fa-solid fa-chevron-right"></i></button>
</div>

<script src="js/data.js?v=20261117"></script>
<script src="js/content.js?v=20261117"></script>
<script src="js/main.js?v=20261117"></script>
<script>window.PQ_QUOTES = [
    ["You don’t take a photograph, you make it.", "Ansel Adams"],
    ["When words become unclear, I shall focus with photographs.", "Ansel Adams"],
    ["There are no rules for good photographs, there are only good photographs.", "Ansel Adams"],
    ["The camera is an instrument that teaches people how to see without a camera.", "Dorothea Lange"],
    ["To me, photography is an art of observation.", "Elliott Erwitt"],
    ["The best camera is the one that’s with you.", "Chase Jarvis"]
  ];</script>
<script src="js/quotes.js?v=20261148"></script>
</body>
</html>
